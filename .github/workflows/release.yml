name: Release

on:
  push:
    tags:
      - "v*.*.*"

# Default deny; each job below requests only what it needs.
permissions: {}

# There is deliberately no `concurrency` block here, unlike ci.yml: cancelling a
# publish half-way is worse than paying for the runner. A cancelled release can
# leave a GitHub release created with no simple-index entry pointing at it.

# The same four stage workflows ci.yml runs — security, tests, build, smoke — in
# the same order, with the release stage on top. They are shared files, not
# copies, so a check cannot drift between the pull-request path and the release
# path: before this split, a tag push ran `pytest tests/ -q` and nothing else,
# skipping every scanner, both linters, the type-check and the compat matrix
# that a pull request had to pass.
jobs:
  # The stage workflows inherit their permissions from the calling job, and the
  # workflow-level default above grants none, so each call has to request the
  # read access its checkout needs.
  security:
    permissions:
      contents: read
    uses: ./.github/workflows/stage-security.yml

  tests:
    needs: security
    permissions:
      contents: read
    uses: ./.github/workflows/stage-tests.yml

  # stage-build takes a bare PEP 440 version, not a tag, so that it stays usable
  # from ci.yml where no tag exists. Stripping the leading "v" needs a shell:
  # GitHub's expression syntax has no substring operator.
  version:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      value: ${{ steps.strip.outputs.value }}
    steps:
      - id: strip
        env:
          TAG: ${{ github.ref_name }}
        run: echo "value=${TAG#v}" >> "$GITHUB_OUTPUT"

  build:
    needs: [tests, version]
    permissions:
      contents: read
    uses: ./.github/workflows/stage-build.yml
    with:
      # Non-empty only on this path: it turns on the check that the version
      # hatch-vcs computed from git history equals the tag being released.
      expected_version: ${{ needs.version.outputs.value }}

  smoke:
    needs: build
    permissions:
      contents: read
    uses: ./.github/workflows/stage-smoke.yml

  github-release:
    needs: [smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # The published files are the ones stage-build produced and then proved
      # installable from a clean venv. Nothing is rebuilt here: a second build
      # could differ from the one the gates ran against.
      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Create GitHub Release with artifacts
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            dist/*.tar.gz
            dist/*.whl

  # ---- PEP 503 "simple" index on the gh-pages branch --------------------
  publish-index:
    needs: [github-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Download dist artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist

      - name: Check whether gh-pages already exists
        # actions/checkout retries+fails noisily (and can abort the job) when
        # asked to fetch a ref that doesn't exist yet, which is exactly the
        # case on the very first release. Check first instead of relying on
        # continue-on-error to paper over the failed fetch.
        id: gh-pages-check
        run: |
          if git ls-remote --exit-code --heads origin gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out gh-pages
        if: steps.gh-pages-check.outputs.exists == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: gh-pages
          path: pages

      - name: Create empty pages/ dir (gh-pages doesn't exist yet)
        if: steps.gh-pages-check.outputs.exists == 'false'
        run: mkdir -p pages

      - name: Regenerate the simple index
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          python - <<'PY'
          import html
          import os
          import re
          from pathlib import Path

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]            # e.g. OxCom/graphify-mesh
          base = f"https://github.com/{repo}/releases/download/{tag}"

          pages = Path("pages")
          proj_dir = pages / "simple" / "graphify-mesh"
          proj_dir.mkdir(parents=True, exist_ok=True)
          proj_index = proj_dir / "index.html"

          # Collect existing links (previous releases) plus this release's files.
          # Only carry forward links pointing at this repo's own GitHub release
          # downloads — anything else in the old index (stale, tampered, or
          # foreign hrefs) is dropped instead of being preserved forever.
          trusted_prefix = f"https://github.com/{repo}/releases/download/"
          links: set[str] = set()
          dropped = 0
          if proj_index.exists():
              for href in re.findall(r'href="([^"]+)"', proj_index.read_text(encoding="utf-8")):
                  if not href.startswith(trusted_prefix):
                      dropped += 1
                      continue
                  links.add(href)
          for dist in sorted(Path("dist").glob("*")):
              if dist.suffix in {".whl"} or dist.name.endswith(".tar.gz"):
                  links.add(f"{base}/{dist.name}")

          def filename(url: str) -> str:
              return url.rsplit("/", 1)[-1]

          rows = "\n".join(
              f'    <a href="{html.escape(u)}">{html.escape(filename(u))}</a><br/>'
              for u in sorted(links, key=filename)
          )
          proj_index.write_text(
              "<!DOCTYPE html>\n<html><head>"
              '<meta name="pypi:repository-version" content="1.0"/>'
              "<title>graphify-mesh</title></head><body>\n"
              f"{rows}\n</body></html>\n",
              encoding="utf-8",
          )

          # Root index listing every project.
          root_index = pages / "simple" / "index.html"
          root_index.write_text(
              "<!DOCTYPE html>\n<html><head><title>Simple index</title></head><body>\n"
              '    <a href="graphify-mesh/">graphify-mesh</a><br/>\n'
              "</body></html>\n",
              encoding="utf-8",
          )
          print(
              f"Wrote {proj_index} with {len(links)} trusted file link(s) kept, "
              f"{dropped} untrusted link(s) dropped"
          )
          PY

      - name: Commit and push the updated index
        # gh-pages history is preserved: when the branch exists it was
        # checked out into pages/ above (with push credentials persisted by
        # actions/checkout), so we commit on top of it and push normally —
        # never `git init` + `git push --force`, which discarded the whole
        # branch history on every release. Only the very first release
        # (branch doesn't exist yet) initializes a fresh repo, and even then
        # the push creates the branch without --force.
        working-directory: pages
        run: |
          if [ ! -d .git ]; then
            git init -b gh-pages
            git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add simple
          if git diff --cached --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "publish ${TAG}: update PEP 503 simple index"
          git push origin gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}

  # pages.yml observes successful completion of this workflow via workflow_run.
  # That follow-up runs on main instead of inheriting this release's tag ref.
