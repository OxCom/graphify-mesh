name: CI

on:
  push:
    branches: [main]
  pull_request:
  # The nightly run asks a question no push-triggered run can ask: did the
  # world change while this repository stood still? pip-audit answers it for
  # the dependency tree, since a CVE gets published against code that has not
  # been touched, and the floating-latest lane of graphify-compat answers it
  # for upstream graphifyy, whose next release can break the two coupling
  # points this package imports. Both stay green on the last push and go red
  # on their own schedule.
  schedule:
    - cron: '0 3 * * *'
  # Manual re-run for the same two checks, without waiting for 03:00.
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch or pull request makes the run in flight
# pointless, so cancel it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# One pipeline, four stages, in this order: security, tests, build, smoke. Each
# stage is a reusable workflow whose jobs run in parallel; the stages themselves
# are sequential, so a leaked secret stops the run before anything is built and
# a failing test stops it before anything is published. release.yml calls these
# same four stage workflows in the same order and adds the release stage on top,
# so a tag cannot take a shortcut past a check a pull request has to pass.
jobs:
  security:
    uses: ./.github/workflows/stage-security.yml

  tests:
    needs: security
    uses: ./.github/workflows/stage-tests.yml

  # No expected_version on this path: outside a release there is no tag to
  # compare the built wheel against, so the build runs without the version gate.
  build:
    needs: tests
    uses: ./.github/workflows/stage-build.yml

  smoke:
    needs: build
    uses: ./.github/workflows/stage-smoke.yml
